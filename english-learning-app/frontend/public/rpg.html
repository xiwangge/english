<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词英雄传 - Word Battle RPG</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(to bottom, #1a1a2e, #16213e); /* 深色战斗背景 */
            border: 4px solid #4a4e69;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        /* 战斗UI层 */
        .hud {
            position: absolute;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            top: 0;
        }

        .unit-status {
            width: 300px;
        }

        .hp-bar-bg {
            width: 100%;
            height: 20px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.3s ease-out;
        }

        #hero-hp { background: #2ecc71; }
        #enemy-hp { background: #e74c3c; }

        .name { font-size: 20px; font-weight: bold; text-shadow: 1px 1px 2px black; }

        /* 单词显示区域 */
        #word-display-area {
            position: absolute;
            bottom: 120px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        #target-word {
            font-size: 60px;
            font-weight: bold;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .char-typed { color: #f1c40f; text-shadow: 0 0 10px #f1c40f; } /* 打过的字变金光 */
        .char-untyped { color: #95a5a6; }
        
        #translation {
            font-size: 24px;
            color: #bdc3c7;
            margin-top: 10px;
            opacity: 0.8;
        }

        /* 技能提示 */
        #skill-indicator {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            color: #3498db;
        }

        /* 游戏结束遮罩 */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            display: none; /* 默认隐藏 */
        }
        
        /* 启动提示 */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            cursor: pointer;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* 伤害数字动画 */
        .damage-text {
            position: absolute;
            font-size: 40px;
            font-weight: bold;
            color: #fff;
            pointer-events: none;
            animation: floatUp 0.8s forwards;
            text-shadow: 2px 2px 0 #000;
            z-index: 15;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }

        /* 震动特效 */
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="hud">
            <div class="unit-status">
                <div class="name">🐵 齐天大圣 (HERO)</div>
                <div class="hp-bar-bg"><div id="hero-hp" class="hp-bar-fill"></div></div>
            </div>
            <div class="unit-status" style="text-align: right;">
                <div class="name">👹 暗黑魔王 (BOSS)</div>
                <div class="hp-bar-bg"><div id="enemy-hp" class="hp-bar-fill" style="float: right;"></div></div>
            </div>
        </div>

        <div id="word-display-area">
            <div id="target-word"></div>
            <div id="translation"></div>
        </div>
        
        <div id="skill-indicator">连续拼写正确可造成暴击伤害！</div>

        <div id="overlay">
            <h1 id="result-title" style="font-size: 60px; margin-bottom: 20px;">VICTORY</h1>
            <button onclick="resetGame()">再战一局</button>
        </div>

        <div id="start-screen" onclick="initGame()">
            <h1>⚔️ 单词英雄传 ⚔️</h1>
            <p style="font-size: 20px; color: #aaa;">点击屏幕开始战斗 (开启音效)</p>
        </div>
    </div>

<script>
    // --- 游戏配置与数据 ---
    // 单词库：分为普通攻击(短)和大招(长)
    const wordBank = [
        { word: "apple", trans: "苹果 (普通攻击)", power: 10 },
        { word: "fight", trans: "战斗 (普通攻击)", power: 12 },
        { word: "sword", trans: "宝剑 (普通攻击)", power: 15 },
        { word: "brave", trans: "勇敢 (普通攻击)", power: 15 },
        { word: "magic", trans: "魔法 (普通攻击)", power: 18 },
        { word: "power", trans: "力量 (普通攻击)", power: 12 },
        // 大招词汇
        { word: "extraordinary", trans: "非凡的 (🔥终极技能)", power: 50 },
        { word: "magnificent", trans: "宏伟的 (🔥终极技能)", power: 45 },
        { word: "adventure", trans: "冒险 (⚡️强力重击)", power: 30 },
        { word: "challenge", trans: "挑战 (⚡️强力重击)", power: 35 },
        { word: "victorious", trans: "胜利的 (🔥终极技能)", power: 40 }
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const heroHpBar = document.getElementById('hero-hp');
    const enemyHpBar = document.getElementById('enemy-hp');
    const wordEl = document.getElementById('target-word');
    const transEl = document.getElementById('translation');
    const overlay = document.getElementById('overlay');
    const startScreen = document.getElementById('start-screen');

    // --- 游戏状态 ---
    let gameState = {
        running: false,
        hero: { maxHp: 100, hp: 100, x: 150, y: 300, scale: 1 },
        enemy: { maxHp: 200, hp: 200, x: 650, y: 300, scale: 1, attackTimer: 0, attackInterval: 180 }, // 180帧(约3秒)攻击一次
        currentWordObj: null,
        inputIndex: 0,
        particles: [],
        damages: [] // 飘字
    };

    // --- 音频系统 ---
    let audioCtx;
    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'hit') {
            // 打击音效
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'bgm') {
            // 简单的背景低音节奏
            // 这里为了不吵，暂时只做打击音效
        } else if (type === 'win') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    // --- 图片加载 (占位符逻辑) ---
    // 如果你有生成的图片，修改这里的 src
    const heroImg = new Image();
    heroImg.src = '../src/assets/images/team_4.png'; // 例如 'images/hero.png'，留空则绘制方块
    
    const enemyImg = new Image();
    enemyImg.src = '../src/assets/images/team_22.png'; // 例如 'images/monster.png'

    // --- 核心逻辑 ---

    function initGame() {
        startScreen.style.display = 'none';
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        window.addEventListener('keydown', handleInput);
        resetGame();
        loop();
    }

    function resetGame() {
        gameState.running = true;
        gameState.hero.hp = gameState.hero.maxHp;
        gameState.enemy.hp = gameState.enemy.maxHp;
        gameState.enemy.attackTimer = 0;
        gameState.particles = [];
        gameState.damages = [];
        overlay.style.display = 'none';
        updateHpUI();
        spawnNewWord();
    }

    function spawnNewWord() {
        // 随机取词
        const randomIndex = Math.floor(Math.random() * wordBank.length);
        gameState.currentWordObj = wordBank[randomIndex];
        gameState.inputIndex = 0;
        renderWordUI();
    }

    function renderWordUI() {
        const word = gameState.currentWordObj.word;
        const idx = gameState.inputIndex;
        
        // 拼接HTML：已输入的变色，未输入的灰色
        let html = `<span class="char-typed">${word.substring(0, idx)}</span>`;
        html += `<span class="char-untyped">${word.substring(idx)}</span>`;
        
        wordEl.innerHTML = html;
        transEl.innerText = gameState.currentWordObj.trans;
    }

    function handleInput(e) {
        if (!gameState.running) return;

        const targetChar = gameState.currentWordObj.word[gameState.inputIndex];
        
        if (e.key.toLowerCase() === targetChar.toLowerCase()) {
            // 输入正确
            gameState.inputIndex++;
            playSound('type'); // 可以加个轻微的打字音效
            
            // 英雄攻击动作预备（稍微变大）
            gameState.hero.scale = 1.1;
            setTimeout(() => gameState.hero.scale = 1, 100);

            // 单词拼写完成？
            if (gameState.inputIndex >= gameState.currentWordObj.word.length) {
                heroAttack();
            }
            renderWordUI();
        } else {
            // 输入错误？可以扣点分或者屏幕红闪一下
        }
    }

    function heroAttack() {
        // 造成伤害
        const dmg = gameState.currentWordObj.power;
        gameState.enemy.hp -= dmg;
        playSound('hit');
        
        // 特效
        spawnParticles(gameState.enemy.x, gameState.enemy.y, '#e74c3c');
        spawnDamageText(dmg, gameState.enemy.x, gameState.enemy.y - 50, 'yellow');
        
        // 敌人受击动画
        gameState.enemy.x += 10; 
        setTimeout(() => gameState.enemy.x -= 10, 100);

        // 检查胜利
        if (gameState.enemy.hp <= 0) {
            gameState.enemy.hp = 0;
            gameOver(true);
        } else {
            spawnNewWord();
        }
        updateHpUI();
    }

    function enemyAttack() {
        // 敌人攻击
        const dmg = 15;
        gameState.hero.hp -= dmg;
        playSound('hit');

        // 特效
        spawnParticles(gameState.hero.x, gameState.hero.y, '#2ecc71');
        spawnDamageText("-" + dmg, gameState.hero.x, gameState.hero.y - 50, 'red');

        // 屏幕震动
        document.getElementById('game-container').classList.add('shake');
        setTimeout(() => document.getElementById('game-container').classList.remove('shake'), 500);

        if (gameState.hero.hp <= 0) {
            gameState.hero.hp = 0;
            gameOver(false);
        }
        updateHpUI();
    }

    function updateHpUI() {
        const hPct = (gameState.hero.hp / gameState.hero.maxHp) * 100;
        const ePct = (gameState.enemy.hp / gameState.enemy.maxHp) * 100;
        heroHpBar.style.width = hPct + '%';
        enemyHpBar.style.width = ePct + '%';
    }

    function gameOver(win) {
        gameState.running = false;
        overlay.style.display = 'flex';
        const title = document.getElementById('result-title');
        if (win) {
            title.innerText = "VICTORY!";
            title.style.color = "#f1c40f";
            playSound('win');
        } else {
            title.innerText = "DEFEAT...";
            title.style.color = "#e74c3c";
        }
    }

    // --- 特效系统 ---

    function spawnParticles(x, y, color) {
        for(let i=0; i<10; i++) {
            gameState.particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color
            });
        }
    }

    function spawnDamageText(text, x, y, color) {
        const el = document.createElement('div');
        el.className = 'damage-text';
        el.innerText = text;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.color = color;
        document.getElementById('game-container').appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    function draw() {
        // 清空
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 绘制英雄 (圆形替代，或画图)
        ctx.save();
        ctx.translate(gameState.hero.x, gameState.hero.y);
        ctx.scale(gameState.hero.scale, gameState.hero.scale);
        if (heroImg.complete && heroImg.src) {
            ctx.drawImage(heroImg, -50, -50, 100, 100); // 假设头像是 100x100
        } else {
            // 默认画个绿球代表英雄
            ctx.beginPath();
            ctx.arc(0, 0, 40, 0, Math.PI * 2);
            ctx.fillStyle = '#2ecc71';
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("Hero", 0, 5);
        }
        ctx.restore();

        // 2. 绘制敌人
        ctx.save();
        ctx.translate(gameState.enemy.x, gameState.enemy.y);
        if (enemyImg.complete && enemyImg.src) {
            ctx.drawImage(enemyImg, -60, -60, 120, 120);
        } else {
            // 默认画个红球代表魔王
            ctx.beginPath();
            ctx.arc(0, 0, 60, 0, Math.PI * 2);
            ctx.fillStyle = '#e74c3c';
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("Boss", 0, 5);
        }
        
        // 敌人攻击倒计时圈
        if (gameState.running) {
            const pct = gameState.enemy.attackTimer / gameState.enemy.attackInterval;
            ctx.beginPath();
            ctx.arc(0, 0, 70, -Math.PI/2, -Math.PI/2 + (Math.PI*2 * pct));
            ctx.strokeStyle = 'orange';
            ctx.lineWidth = 5;
            ctx.stroke();
        }
        ctx.restore();

        // 3. 绘制粒子
        for (let i = gameState.particles.length - 1; i >= 0; i--) {
            let p = gameState.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            if (p.life <= 0) gameState.particles.splice(i, 1);
        }
    }

    function loop() {
        if (gameState.running) {
            // 敌人攻击逻辑
            gameState.enemy.attackTimer++;
            if (gameState.enemy.attackTimer >= gameState.enemy.attackInterval) {
                enemyAttack();
                gameState.enemy.attackTimer = 0;
            }
        }
        draw();
        requestAnimationFrame(loop);
    }

</script>
</body>
</html>
