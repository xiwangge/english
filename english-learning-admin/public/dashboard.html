<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>监控看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fcf6ed;
            margin: 0;
            padding: 40px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 30px;
            font-weight: normal;
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        .stat-card {
            background-color: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .stat-card h2 {
            font-size: 1.2em;
            margin-top: 0;
            margin-bottom: 10px;
            color: #888;
            font-weight: 500;
        }
        .stat-card p {
            font-size: 2.5em;
            margin: 0;
            font-weight: bold;
            color: #e59f42;
        }
        .chart-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>监控看板</h1>

        <div class="stats-container">
            <div class="stat-card">
                <h2>用户总数</h2>
                <p id="totalUsers">0</p>
            </div>
            <div class="stat-card">
                <h2>付费用户总数</h2>
                <p id="payingUsers">0</p>
            </div>
            <div class="stat-card">
                <h2>当前订阅用户</h2>
                <p id="activeSubscribers">0</p>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="newUserChart"></canvas>
        </div>
    </div>

    <script>
        async function fetchDashboardData() {
            try {
                const response = await fetch('/api/dashboard-stats', {
                    headers: {
                        'Authorization': 'admin' // 简单的身份验证
                    }
                });
                if (!response.ok) {
                    throw new Error('获取数据失败');
                }
                const data = await response.json();

                // 更新统计卡片
                document.getElementById('totalUsers').textContent = data.totalUsers;
                document.getElementById('payingUsers').textContent = data.payingUsers;
                document.getElementById('activeSubscribers').textContent = data.activeSubscribers;

                // 渲染图表
                renderNewUserChart(data.newUserTrends);

            } catch (error) {
                console.error('加载看板数据时出错:', error);
                alert('无法加载看板数据，请检查控制台。');
            }
        }

        function renderNewUserChart(trends) {
            const ctx = document.getElementById('newUserChart').getContext('2d');
            
            const labels = trends.map(item => item.date);
            const data = trends.map(item => item.count);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '每日新增用户数',
                        data: data,
                        backgroundColor: 'rgba(229, 159, 66, 0.2)',
                        borderColor: 'rgba(229, 159, 66, 1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                // 确保Y轴只显示整数
                                stepSize: 1
                            }
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: '新增用户趋势',
                            font: {
                                size: 18
                            }
                        }
                    }
                }
            });
        }

        // 页面加载时获取数据
        window.addEventListener('load', fetchDashboardData);
    </script>
</body>
</html>
