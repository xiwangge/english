<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>价格管理</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        .product-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .product-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .product-item label {
            flex-basis: 100px;
        }

        .product-item input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-save {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-save:hover {
            background-color: #0056b3;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: green;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>会员价格管理</h1>
        <div id="product-form" class="product-form">
            <!-- 产品将通过 JS 动态加载 -->
        </div>
        <button id="save-button" class="btn-save">保存更改</button>
        <p id="message"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('product-form');
            const saveButton = document.getElementById('save-button');
            const messageEl = document.getElementById('message');
            const token = 'admin'; // 简单的硬编码 admin token

            let productsData = [];

            // 获取产品数据
            async function fetchProducts() {
                try {
                    const response = await fetch('/api/products');
                    if (!response.ok) throw new Error('获取数据失败');
                    productsData = await response.json();
                    renderForm();
                } catch (error) {
                    messageEl.textContent = error.message;
                    messageEl.style.color = 'red';
                }
            }

            // 渲染表单
            function renderForm() {
                form.innerHTML = '';
                productsData.forEach(product => {
                    const item = document.createElement('div');
                    item.className = 'product-item-container';
                    item.style.borderBottom = '1px solid #eee';
                    item.style.paddingBottom = '15px';
                    item.style.marginBottom = '15px';
                    item.innerHTML = `
                        <h3 style="margin-top:0">${product.name} (${product.type})</h3>
                        <div class="product-item">
                            <label>价格 (GBP):</label>
                            <input type="number" class="price-input" data-type="${product.type}" value="${product.price}">
                        </div>
                        <div class="product-item" style="margin-top:10px">
                            <label>Stripe Price ID:</label>
                            <input type="text" class="stripe-id-input" data-type="${product.type}" value="${product.stripePriceId || ''}" placeholder="price_...">
                        </div>
                    `;
                    form.appendChild(item);
                });
            }

            // 保存更改
            saveButton.addEventListener('click', async () => {
                const updatedProducts = [];
                const containers = form.querySelectorAll('.product-item-container');
                containers.forEach(container => {
                    const priceInput = container.querySelector('.price-input');
                    const stripeIdInput = container.querySelector('.stripe-id-input');
                    updatedProducts.push({
                        type: priceInput.dataset.type,
                        price: parseFloat(priceInput.value),
                        stripePriceId: stripeIdInput.value.trim()
                    });
                });

                try {
                    const response = await fetch('/api/products/update', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': token
                        },
                        body: JSON.stringify({ products: updatedProducts })
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.message || '保存失败');
                    }
                    messageEl.textContent = '价格更新成功！';
                    messageEl.style.color = 'green';
                    setTimeout(() => messageEl.textContent = '', 3000);
                } catch (error) {
                    messageEl.textContent = error.message;
                    messageEl.style.color = 'red';
                }
            });

            fetchProducts();
        });
    </script>
</body>

</html>
